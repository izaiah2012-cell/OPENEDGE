name: OPENEDGE Morning Workflow

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 13:30 UTC (adjust to your local market-prep window)
    - cron: "30 13 * * 1-5"

jobs:
  morning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run morning workflow
        run: python openedge.py morning

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openedge-reports-${{ github.run_id }}
          path: |
            reports/*.md
            reports/*.json
            reports/*.html
            logs/*.log
            database/workflow_status.json
          if-no-files-found: warn
